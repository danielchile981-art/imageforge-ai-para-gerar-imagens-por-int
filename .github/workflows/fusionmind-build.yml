name: Build FusionMind AI APK
on:
  push:
    branches: [ "fusionmind-ai" ]
    paths: [ "fusionmind/**", ".github/workflows/fusionmind-build.yml" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fusionmind
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fusionmind-ai
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../FusionMind-AI-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FusionMind-AI-APK
          path: FusionMind-AI-debug.apk
          retention-days: 30
