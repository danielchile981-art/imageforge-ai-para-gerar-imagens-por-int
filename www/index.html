<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ImageForge AI para gerar imagens por int</title><link rel="stylesheet" href="style.css"><script src="https://js.puter.com/v2/"></script></head><body><header><h1>ImageForge AI para gerar imagens por int</h1><p class="muted">Gerar e editar imagens com IA a partir de prompts.</p></header><main><section class="card"><h2>Gerar imagem</h2><textarea id="prompt" rows="4" placeholder="Ex.: carro esportivo preto em uma cidade futurista à noite"></textarea><div class="row"><select id="ratio" class="grow"><option value="1:1">Quadrado 1:1</option><option value="4:5">Retrato 4:5</option><option value="16:9">Paisagem 16:9</option></select><select id="quality" class="grow"><option value="low">Rápida</option><option value="medium">Média</option><option value="high">Alta</option></select></div><button id="generate">GERAR IMAGEM</button></section><section class="card"><h2>Editar imagem</h2><input id="file" type="file" accept="image/*"><img id="sourcePreview" class="bigimg hidden" alt="Imagem selecionada"><textarea id="editPrompt" rows="3" placeholder="Ex.: troque o fundo por uma praia e mantenha a pessoa"></textarea><button id="edit">EDITAR COM IA</button></section><section class="card"><h2>Resultado</h2><div id="empty" class="muted">Sua imagem aparecerá aqui.</div><img id="result" class="bigimg hidden" alt="Resultado gerado"><div id="actions" class="hidden"><button id="download">BAIXAR</button><button id="share" class="secondary">COMPARTILHAR</button></div><div id="st" class="status">Pronto.</div></section><section class="card"><h2>Histórico desta sessão</h2><div id="history"></div></section></main><script src="app.js"></script></body></html>
